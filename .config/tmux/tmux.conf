set-option -g default-terminal "screen-256color"
# Neovim 24-Bit Trye Color & Squiggly Undercurl Diagnostics
set-option -a terminal-features ",$TERM*:RGB"
set-option -a terminal-features ",$TERM*:usstyle"
# Pass focus events through to Neovim (Crucial for autoread)
set-option -g focus-events on
set-option -g set-clipboard on

# Neovim Eliminate Escape Key Delete
set -s escape-time 10

bind r source-file ~/.tmux.conf
set -g base-index 1

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# status bar
set -s theme terminal
set -g status-interval 10
set -g status-left-length 50
set -g status-left-style "fg=colour0,bg=white"

# Window list (inactive)
set -g window-status-format " #I: #W "
set -g window-status-style "fg=colour0,bg=default"

# Window list (active)
set -g window-status-current-format " #I: #W "
set -g window-status-current-style "fg=green,bg=colour0"


# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# List plugins
set -g @plugin 'tmux-plugins/tpm'

# Initialize TPM, keep this line at the bottom
run '~/.config/tmux/plugins/tpm/tpm'
